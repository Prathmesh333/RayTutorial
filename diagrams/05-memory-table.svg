<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940">
<rect width="1800" height="940" fill="#101b2b"/>
<text x="70" y="98" font-family="Arial,sans-serif" font-size="48" fill="white">70 billion parameters: a state-memory estimate</text>
<rect x="60" y="170" width="1680" height="100" fill="#244761"/>
<text x="80" y="222" font-family="Arial,sans-serif" font-size="32" fill="#50d6bd">Stored state</text>
<text x="660" y="222" font-family="Arial,sans-serif" font-size="32" fill="#50d6bd">Assumption</text>
<text x="1310" y="222" font-family="Arial,sans-serif" font-size="32" fill="#50d6bd">Approximate memory</text>
<rect x="60" y="270" width="1680" height="110" fill="#1b2c42"/>
<text x="80" y="322" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">Weights</text>
<text x="660" y="322" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">2 bytes per parameter</text>
<text x="1310" y="322" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">140 GB</text>
<rect x="60" y="380" width="1680" height="110" fill="#152438"/>
<text x="80" y="432" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">Gradients</text>
<text x="660" y="432" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">2 bytes per parameter</text>
<text x="1310" y="432" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">140 GB</text>
<rect x="60" y="490" width="1680" height="110" fill="#1b2c42"/>
<text x="80" y="542" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">Adam moment buffers</text>
<text x="660" y="542" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">Two FP32 buffers</text>
<text x="1310" y="542" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">560 GB</text>
<rect x="60" y="600" width="1680" height="110" fill="#152438"/>
<text x="80" y="652" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">Master weights, if used</text>
<text x="660" y="652" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">4 bytes per parameter</text>
<text x="1310" y="652" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">280 GB</text>
<rect x="60" y="710" width="1680" height="110" fill="#1b2c42"/>
<text x="80" y="762" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">Total with master weights</text>
<text x="660" y="762" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">16 bytes per parameter</text>
<text x="1310" y="762" font-family="Arial,sans-serif" font-size="32" fill="#e5edf5">1.12 TB</text>
<text x="70" y="892" font-family="Arial,sans-serif" font-size="27" fill="#bbcede">Decimal units. Excludes activations, temporary buffers, fragmentation, and communication buffers.</text>
</svg>