<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<rect width="1800" height="1000" fill="#101b2b"/>
<text x="80" y="112" font-family="Arial,sans-serif" font-size="52" fill="white" text-anchor="start">One cluster, several machines</text>
<text x="80" y="172" font-family="Arial,sans-serif" font-size="27" fill="#c7d7e8" text-anchor="start">Conceptual control and data paths; resource counts are illustrative.</text>
