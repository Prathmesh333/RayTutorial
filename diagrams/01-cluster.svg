<text x="80" y="877" font-family="Arial,sans-serif" font-size="27" fill="#c7d7e8" text-anchor="start">Raylets schedule work locally and coordinate placement across nodes.</text>
<text x="80" y="927" font-family="Arial,sans-serif" font-size="27" fill="#c7d7e8" text-anchor="start">PyTorch or an inference engine performs tensor communication; Ray schedules the workers.</text>
