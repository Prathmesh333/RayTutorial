<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<rect width="1800" height="1000" fill="#101b2b"/>
<text x="80" y="112" font-family="Arial,sans-serif" font-size="52" fill="white" text-anchor="start">Replicas and a distributed model solve different problems</text>
<text x="80" y="172" font-family="Arial,sans-serif" font-size="27" fill="#c7d7e8" text-anchor="start">A logical model replica can itself require several GPUs and machines.</text>
<rect x="80" y="260" width="700" height="110" rx="18" fill="#1b3550" stroke="#6585a7" stroke-width="3"/>
<text x="430.0" y="307.0" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle">Independent replicas</text>
<text x="430.0" y="352.6666666666667" font-family="Arial,sans-serif" font-size="23" fill="#c7d7e8" text-anchor="middle">Each replica has a complete model</text>
<rect x="980" y="260" width="740" height="110" rx="18" fill="#1b3550" stroke="#6585a7" stroke-width="3"/>
<text x="1350.0" y="307.0" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle">One partitioned replica</text>
<text x="1350.0" y="352.6666666666667" font-family="Arial,sans-serif" font-size="23" fill="#c7d7e8" text-anchor="middle">All partitions cooperate on inference</text>
<rect x="90" y="490" width="320" height="170" rx="18" fill="#1b3550" stroke="#6585a7" stroke-width="3"/>
<text x="250.0" y="567.0" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle">Replica A</text>
<text x="250.0" y="612.6666666666666" font-family="Arial,sans-serif" font-size="23" fill="#c7d7e8" text-anchor="middle">Complete model</text>
<rect x="480" y="490" width="320" height="170" rx="18" fill="#1b3550" stroke="#6585a7" stroke-width="3"/>
<text x="640.0" y="567.0" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle">Replica B</text>
<text x="640.0" y="612.6666666666666" font-family="Arial,sans-serif" font-size="23" fill="#c7d7e8" text-anchor="middle">Complete model</text>
<rect x="1000" y="490" width="320" height="170" rx="18" fill="#1b3550" stroke="#6585a7" stroke-width="3"/>
<text x="1160.0" y="567.0" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle">Node A: 4 GPUs</text>
<text x="1160.0" y="612.6666666666666" font-family="Arial,sans-serif" font-size="23" fill="#c7d7e8" text-anchor="middle">Pipeline stage 0; TP=4</text>
<rect x="1400" y="490" width="320" height="170" rx="18" fill="#1b3550" stroke="#6585a7" stroke-width="3"/>
<text x="1560.0" y="567.0" font-family="Arial,sans-serif" font-size="30" fill="white" text-anchor="middle">Node B: 4 GPUs</text>
<text x="1560.0" y="612.6666666666666" font-family="Arial,sans-serif" font-size="23" fill="#c7d7e8" text-anchor="middle">Pipeline stage 1; TP=4</text>
<line x1="1320" y1="575" x2="1400" y2="575" stroke="#50d6bd" stroke-width="4"/>
<polygon points="1400,575 1383.420902107948,582.0095301615557 1383.420902107948,567.9904698384443" fill="#50d6bd"/>
<text x="80" y="877" font-family="Arial,sans-serif" font-size="27" fill="#c7d7e8" text-anchor="start">Left: route each request to one replica. Right: stage 0 sends activations to stage 1.</text>
<text x="80" y="927" font-family="Arial,sans-serif" font-size="27" fill="#c7d7e8" text-anchor="start">Right: 4 tensor-parallel workers x 2 pipeline stages = 8 GPUs per replica; placement must match.</text>
</svg>